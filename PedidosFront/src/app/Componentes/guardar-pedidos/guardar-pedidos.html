<div class="container d-flex justify-content-center align-items-center mt-3">

    <div class="card shadow p-4" style="width: 500px; user-select: none;">

        <h3 class="text-center mb-4">
            REGISTRO DE PEDIDOS
        </h3>

        <form (ngSubmit)="guardar()">

            <div class="mb-3">
                <label class="form-label">
                    PROVEEDOR:
                </label>
                <select class="form-select" [(ngModel)]="pedido.proveedor" name="proveedor">
                    @for (p of proveedores; track p.idProveedor) {
                    <option [value]="p.idProveedor">
                        {{ p.nombre }}
                    </option>
                    }
                </select>
            </div>

            @for(pedido of pedido.pedidos; track $index){
            <div class="border rounded p-3 mb-3">
                <h6 class="mb-3 d-flex justify-content-between align-items-center">
                    <span>
                        Pedido {{ $index + 1 }}
                    </span>
                    <small class="text-muted">
                        {{ getNombreConStock(pedido.producto) }}
                    </small>
                </h6>

                <div class="mb-3">
                    <label class="form-label">
                        Producto:
                    </label>

                    <select class="form-select" [(ngModel)]="pedido.producto" name="producto{{$index}}">

                        <option value="">
                            Seleccione un producto
                        </option>

                        @for (prod of productosDisponibles($index); track prod.idInventario) {

                        <option [value]="prod.nombre">
                            {{ prod.nombre }}
                        </option>

                        }

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Cantidad:
                    </label>
                    <input type="number" class="form-control" [(ngModel)]="pedido.cantidad" name="cantidad{{$index}}"
                        min="1">
                </div>
            </div>
            }

            <div class="row g-2">

                <div class="col-6">
                    <button type="button" class="btn btn-primary w-100" (click)="agregarPedido()">

                        <i class="bi bi-plus-circle"></i>
                        Agregar pedido
                    </button>
                </div>

                <div class="col-6">
                    <button type="button" class="btn btn-secondary w-100" (click)="retirarPedido()"
                        [disabled]="pedido.pedidos.length === 1">

                        <i class="bi bi-dash-circle"></i>
                        Retirar pedido
                    </button>
                </div>

                <div class="col-6">
                    <button class="btn btn-danger w-100">
                        <i class="bi bi-file-earmark-pdf-fill"></i>
                        Generar PDF
                    </button>
                </div>

                <div class="col-6">
                    <button type="button" class="btn btn-warning w-100" (click)="cancelar()">

                        <i class="bi bi-x-circle me-2"></i>
                        Cancelar
                    </button>
                </div>

            </div>
        </form>
    </div>
</div>
