<div class="container d-flex justify-content-center align-items-center mt-3">
    <div class="card shadow p-4" style="width:400px; user-select: none;">
        <h2 class="fw-bold text-secondary text-center mb-2">
            Actualizar contraseña
        </h2>
        <p class="text-center text-muted mb-4">
            Modifica la contraseña de {{username}}
        </p>

        <form>
            <div class="mb-3">
                <label class="form-label fw-semibold">Contraseña actual: </label>
                <input [type]="showPassword ? 'text' : 'password'" name="username" class="form-control form-control-lg"
                    placeholder="Escribe tu contraseña actual" [(ngModel)]="password_actual">
            </div>            
            <div class="mb-3">
                <label class="form-label fw-semibold">Nueva contraseña: </label>
                <input [type]="showPassword ? 'text' : 'password'" name="password" class="form-control form-control-lg"
                    placeholder="Ingresa una nueva contraseña" [(ngModel)]="password_nuevo">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Confirmar contraseña: </label>
                <input [type]="showPassword ? 'text' : 'password'" name="confirm" class="form-control form-control-lg"
                    placeholder="Confirma la contraseña" [(ngModel)]="confirm_password">
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="showPasswordCheck" [(ngModel)]="showPassword"
                    name="showPassword">
                <label class="form-check-label" for="showPasswordCheck">
                    {{showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'}}
                </label>
            </div>

            <div class="d-grid mb-4">
                <button class="btn btn-success btn-lg shadow-sm" type="button" title='Actualizar contraseña'
                    (click)="actualizar()">
                    Actualizar contraseña
                </button>
                <br>
                <button class="btn btn-danger btn-lg shadow-sm" type="button" title='Cancelar modificación' 
                (click)="login()">
                    Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
