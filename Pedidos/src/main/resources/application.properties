spring.application.name=Pedidos
server.port=8080
spring.datasource.url=jdbc:mysql://localhost/microservicios
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.format-sql=true
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.mvc.format.date=d/M/yyyy
springdoc.swagger-ui.path=/swagger-ui.html

resilience4j.circuitbreaker.instances.proveedorService.sliding-window-size=5
resilience4j.circuitbreaker.instances.proveedorService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.proveedorService.wait-duration-in-open-state=10s

resilience4j.circuitbreaker.instances.proveedorService.ignore-exceptions[0]=com.mx.pedidos.excepciones.PedidosNotFoundException
resilience4j.circuitbreaker.instances.proveedorService.ignore-exceptions[1]=com.mx.pedidos.excepciones.ReglaNegocioException
resilience4j.circuitbreaker.instances.proveedorService.record-exceptions[0]=java.io.IOException
resilience4j.circuitbreaker.instances.proveedorService.record-exceptions[1]=feign.RetryableException
resilience4j.circuitbreaker.instances.proveedorService.record-exceptions[2]=feign.FeignException$InternalServerError
resilience4j.circuitbreaker.instances.proveedorService.record-exceptions[3]=feign.FeignException$ServiceUnavailable